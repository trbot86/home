apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

// Set by the local build helper from the prepared household trial, or override with -P.
def householdServerOrigin = providers.gradleProperty('householdServerOrigin').orElse('').get().trim()
if (householdServerOrigin) {
    def origin = new URI(householdServerOrigin)
    if (origin.scheme != 'https' || !origin.host || origin.rawUserInfo || origin.rawQuery || origin.rawFragment || !(origin.path in ['', '/'])) {
        throw new GradleException('householdServerOrigin must be an HTTPS origin without credentials, query or path')
    }
    householdServerOrigin = householdServerOrigin.replaceAll('/+$', '')
}

android {
    namespace = "dev.ourplace.household"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.ourplace.household"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField 'String', 'DEFAULT_SERVER_ORIGIN', groovy.json.JsonOutput.toJson(householdServerOrigin)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    sourceSets { test.resources.srcDirs += ['../../../packages/contracts/test/fixtures', 'schemas'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
}
kotlin { jvmToolchain(21) }
ksp { arg('room.schemaLocation', "$projectDir/schemas") }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
